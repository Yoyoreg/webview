name: Build HomeStore APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Advanced Sign & Align APK
        # استخدام --overwrite و --allowResign يجبر الأداة على معالجة الملف حتى لو كان موقعاً
        run: |
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          java -jar uber-apk-signer-1.3.0.jar --apks app/build/outputs/apk/debug/*.apk --overwrite --allowResign --v2SigningEnabled true --v3SigningEnabled true

      - name: Upload Reliable APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeStore-App-Final
          # هنا التغيير: سنطلب من الأداة البحث عن أي ملف APK في المجلد وفروعه
          path: app/build/outputs/apk/debug/**/*.apk

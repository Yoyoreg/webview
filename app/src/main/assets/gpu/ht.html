    <style>
        body { margin: 0; overflow: hidden; background: #0d7eff; font-family: sans-serif; }
        canvas { display: block; }
        #ui {
            position: absolute; top: 100px; left: 20px;
            background: rgba(255, 255, 255, 1); color: rgb(0, 0, 0);
            padding: 15px; border-radius: 8px; border: 3px solid #000000; pointer-events: none;
            z-index: 10;
        }
        .info { font-size: 14px; margin-bottom: 5px; }
        .highlight { color: #4caf50; font-weight: bold; }
        /* وضعنا الأزرار في يمين الشاشة ومنتصفها عمودياً */
        #ui-controls {
            position: absolute;
            right: 30px;          /* المسافة من الحافة اليمنى */
            top: 50%;             /* النزول لمنتصف الشاشة */
            transform: translateY(-50%); /* إزاحة للأعلى بنصف طول الحاوية للتوسط الدقيق */
            display: flex;
            flex-direction: column; /* جعل الأزرار فوق بعضها */
            gap: 30px;            /* مسافة بين الزرين */
            z-index: 100;         /* للتأكد أنها فوق الخريطة */
            pointer-events: auto; /* ضروري جداً لتتمكن من النقر على الأزرار */
        }

        /* تصميم الزر ليبدو احترافياً ويحتوي الـ SVG */
        .zoom-btn {
            width: 75px;           /* تحديد عرض الزر */
            height: 75px;          /* تحديد طول الزر */
            border: none;          /* إزالة الإطار */
            outline: none;         /* إزالة إطار التركيز الأزرق/الأسود */
            background: transparent; /* جعل الخلفية شفافة تماماً */
            padding: 0;            /* إزالة أي مسافات داخلية تسبب ظهور خلفية */
            cursor: pointer;
            transition: transform 0.2s; /* تنعيم حركة التكبير فقط */
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent; /* إزالة الومضة السوداء في الهواتف */
        }

        /* التفاعل عند تمرير الماوس: نكتفي بتكبير الأيقونة قليلاً */
        .zoom-btn:hover { 
            transform: scale(1.15); 
            background: none; /* تأكيد عدم وجود خلفية */
        }

        .zoom-btn img { 
            width: 100%; 
            height: 100%; 
            display: block;
        }
    </style>

    5% { transform: rotate(12deg) scale(1.05); }

<script>
/**
 * نظام فحص الشبكة التلقائي المبسط (بنفس أسلوب دالة الإرسال الصامتة)
 */
(function() {
    // تعيين قيم مبدئية
    window.ippt = "103";
    window.ip = "103";

    // دالة ذكية تعمل بنظام الانتظار (async/await)
    window.findServerIPSimple = async function() {
        console.log("🔄 جاري البحث الذكي عن السيرفر (نظام الدفعات لتجنب اختناق المتصفح)...");
        
        let found = false;
        const batchSize = 10;   // عدد الأجهزة التي نفحصها في نفس الوقت (10 رقم مثالي وآمن)
        const timeoutMs = 400;  // وقت الانتظار لكل عنوان

        // المرور على العناوين من 1 إلى 254 بنظام الدفعات
        for (let i = 1; i <= 254; i += batchSize) {
            if (found) break; // التوقف فوراً إذا وجدنا السيرفر في الدفعة السابقة

            const batchPromises = [];
            
            // تجهيز دفعة من 10 عناوين
            for (let j = 0; j < batchSize && (i + j) <= 254; j++) {
                const currentIP = (i + j).toString();
                batchPromises.push(checkSingleIP(currentIP, timeoutMs));
            }

            // انتظار هذه الدفعة حتى تنتهي بالكامل قبل الانتقال للدفعة التالية
            const results = await Promise.all(batchPromises);
            
            // التحقق مما إذا كان السيرفر من ضمن هذه الدفعة
            const successIP = results.find(res => res !== null);
            
            if (successIP) {
                window.ippt = successIP;
                window.ip = successIP;
                console.log(`🎯 تم العثور على السيرفر بنجاح! الـ IP هو: 192.168.8.${successIP}`);
                found = true;
                break;
            }
        }
        
        if (!found) {
            console.log("⚠️ انتهى البحث ولم يتم العثور على السيرفر. تأكد من تشغيل بايثون وأنك على نفس الشبكة.");
        }
    };

    // دالة مساعدة لفحص عنوان IP واحد بهدوء
    function checkSingleIP(ipToCheck, timeout) {
        return new Promise((resolve) => {
            const url = `http://192.168.8.${ipToCheck}:8080/?msg=["http_ip_ok"]`;
            const controller = new AbortController();
            
            // مؤقت لقتل الطلب إذا لم يرد

            fetch(url, { signal: controller.signal, mode: 'no-cors' })
                .then(() => {
                    clearTimeout(timer);
                    // إذا وصل الكود إلى هنا، فهذا يعني أن الجهاز موجود ورد علينا!
                    resolve(ipToCheck);
                })
                .catch(() => {
                    clearTimeout(timer);
                    // فشل الاتصال (الجهاز مغلق أو غير موجود)
                    resolve(null);
                });
        });
    }

    // تشغيل الدالة

function changeZoom(factor) {
    const oldZoom = camera.zoom;
    const newZoom = Math.min(Math.max(camera.zoom * factor, 0.3), 5); // حدود الأمان

    if (oldZoom !== newZoom) {
        // الحساب السحري: تعديل موقع الكاميرا ليبقى المركز ثابتاً أثناء التكبير
        // نحن نعدل X و Y بناءً على نسبة التغير في الزووم
        camera.x *= (newZoom / oldZoom);
        camera.y *= (newZoom / oldZoom);
        
        camera.zoom = newZoom;
    }
}


function loadAssets() {
    for (let key in ASSETS_LIB) {
        const img = new Image();
        img.src = ASSETS_LIB[key];
        img.onload = () => { 
            assetsCache[key] = img; 
            console.log(`تم تحميل الأصل: ${key}`);
        };
    }
}

function getOptimizedBitmap(type, zoom) {
    const zoomKey = Math.round(zoom * 10) / 10;

    if (bitmapCache[cacheKey]) return bitmapCache[cacheKey];

    const source = assetsCache[type];
    if (!source || source.width === 0) return null;

    const aspectRatio = source.width / source.height;

    // الحجم المطلوب: 80% من حجم الخانة الأصلي (ثابت)
    const scaleFactor = entityScales[type] || entityScales['default'];
    const maxDimension = tileSize * scaleFactor; 

    // --- الإضافة الوحيدة: حدود الدقة (أقصى دقة للرسم هي زووم 3.0) ---
    const limitedZoom = Math.min(zoom, 10.0); 

    let drawW, drawH;
    if (aspectRatio > 1) { 
        drawW = maxDimension * limitedZoom; // نستخدم الزووم المحدود هنا للرسم فقط
        drawH = drawW / aspectRatio;
    } else { 
        drawH = maxDimension * limitedZoom;
        drawW = drawH * aspectRatio;
    }

    const offCanvas = document.createElement('canvas');
    offCanvas.width = drawW;
    offCanvas.height = drawH;
    const offCtx = offCanvas.getContext('2d');

    offCtx.imageSmoothingEnabled = true;
    offCtx.imageSmoothingQuality = 'high';
    offCtx.drawImage(source, 0, 0, drawW, drawH);

    // نستخدم limitedZoom هنا أيضاً عند القسمة لضمان بقاء w و h مساوية لـ maxDimension دائماً
    bitmapCache[cacheKey] = {
        image: offCanvas,
        w: drawW / limitedZoom, 
        h: drawH / limitedZoom  
    };
    return bitmapCache[cacheKey];
}
// --- جلب البيانات ---
let resourceList = []; // القائمة الجديدة التي ستشبه obj تماماً

// قائمة تجريبية وهمية تحاكي ما سيرسله بايثون لاحقاً
// الترتيب داخل كل مصفوفة صغيرة هو: [Y, X, "Color"]
window.globalmapslct = [   // خانة حمراء (مثلاً: مدى هجوم أو خطر)
];

// --- محرك الرسم ---
function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if (worldMap.length > 0) {
        ctx.save();
        // تحويل المشهد بناءً على الكاميرا
        ctx.translate(canvas.width/2 + camera.x, canvas.height/2 + camera.y);
        ctx.scale(camera.zoom, camera.zoom);

        // 1. رسم الشبكة السوداء الموحدة
        ctx.fillStyle = "#000000";
        ctx.fillRect(-1, -((MAP_DIM-1) * tileSize)-1 + tileSize, (MAP_DIM-1) * tileSize+1, (MAP_DIM-1) * tileSize+1);

        // 2. داخل دالة render - قسم رسم التضاريس
for (let y = 0; y < worldMap.length; y++) {
    for (let x = 0; x < worldMap[y].length; x++) {
        // نجلب القيمة الموجودة في خانة التضاريس [0]
        const cellValue = worldMap[y][x]; 
        
        const tx = x * tileSize;
        const ty = -(y * tileSize);

        // --- أولاً: التحقق هل هي عاصمة؟ ---
        if (CAPITALS_LIB[cellValue]) {
            // إذا كانت عاصمة (مثل "ppp")، نرسم صورتها
            if (!loadedCapitals[cellValue]) {
                loadedCapitals[cellValue] = new Image();
                loadedCapitals[cellValue].src = CAPITALS_LIB[cellValue];
                loadedCapitals[cellValue].onload = () => { /* إعادة رسم تلقائية */ };
            }

            const capImg = loadedCapitals[cellValue];
            if (capImg.complete) {
                // ملء الخانة بصورة العاصمة تماماً
                ctx.drawImage(capImg, tx, ty, tileSize - 1, tileSize - 1);
            }
        } 
        // --- ثانياً: إذا لم تكن عاصمة، هل هي تضاريس عادية؟ ---
        else {
            const terrain = TERRAIN_CONFIG[cellValue];
            if (terrain) {
                ctx.fillStyle = terrain.color;
                ctx.fillRect(tx, ty, tileSize - 1, tileSize - 1);
            } else {
                // لون افتراضي في حال كانت الخانة فارغة أو غير معروفة
                ctx.fillStyle = "#333"; 
                ctx.fillRect(tx, ty, tileSize - 1, tileSize - 1);
            }
        }
    }
}
        // 3. رسم الكائنات أو الموارد بناءً على مفتاح vsb
        // 3. رسم الكائنات أو الموارد بناءً على مفتاح vsb
        ctx.imageSmoothingEnabled = (camera.zoom < 1.5);

        const margin = 2;
        const leftX = (-camera.x - canvas.width / 2) / (tileSize * camera.zoom) - margin;
        const rightX = (-camera.x + canvas.width / 2) / (tileSize * camera.zoom) + margin;
        const topY = (camera.y - canvas.height / 2) / (tileSize * camera.zoom) - margin;
        const bottomY = (camera.y + canvas.height / 2) / (tileSize * camera.zoom) + margin;

        const currentListToDraw = vsb ? (typeof resourceList !== 'undefined' ? resourceList : []) : obj;

        // مصفوفة الطبقات بالترتيب: 0 للبيئة/الأرض، 1 للمنشآت المدنية، 2 للقطع اللوجستية والعسكرية
        const layers = [0, 1, 2];

        // نكرر الرسم لكل طبقة بالترتيب لضمان ظهور الطبقات العليا فوق السفلى دائماً
        layers.forEach(currentLayer => {
            currentListToDraw.forEach(entity => {
                // استقبال الطبقة كعنصر رابع (إذا لم يرسلها بايثون نعتبرها طبقة 1 كافتراضي للتبسيط)
                const [type, y, x, layer = 1] = entity; 

                // نرسم الكائن فقط إذا كان ينتمي للطبقة الحالية التي يتم معالجتها الآن
                if (layer === currentLayer) {
                    if (x >= leftX && x <= rightX && y >= topY && y <= bottomY) {
                        const data = getOptimizedBitmap(type, camera.zoom);
                        if (data) {
                            const tileX = x * tileSize;
                            const tileY = -(y * tileSize);
                            const offsetX = (tileSize - data.w) / 2;
                            const offsetY = (tileSize - data.h) / 2;
                            ctx.drawImage(data.image, tileX + offsetX, tileY + offsetY, data.w, data.h);
                        }
                    }
                }
            });
        });
        
        playerPresenceList.forEach(p => {
            const pId = p[0];
            const px = p[1];
            const py = p[2];

            // جلب اللون من القاموس
            const playerColor = player_colors[pId];

            // التحقق: إذا لم يكن هناك لون (لاعب مجهول أو خانة فارغة) يتخطى الرسم فوراً
            if (!playerColor || pId === "") return;

            ctx.fillStyle = playerColor;
            ctx.beginPath();
    
            // حسابات الموقع (أعلى-يسار الخلية)
            const radius = tileSize * 0.08; 
            // ملاحظة: أضفنا 2 بكسل كهامش لتبتعد الدائرة عن حدود الإطار الأسود قليلاً
            const drawX = px * tileSize + radius + 3;
            const drawY = -(py * tileSize) + radius + 3;

            ctx.arc(drawX, drawY, radius, 0, Math.PI * 2);
            ctx.fill();

            // إطار أبيض صغير لتمييز الدائرة عن الخلفية
            ctx.strokeStyle = "white";
            ctx.lineWidth = 0.5;
            ctx.stroke();
        });




        // رسم الإضاءة للخانة المختارة
        // 1. رسم خانات النظام المحددة (window.globalmapslct) القادمة من بايثون
        if (typeof window.globalmapslct !== 'undefined' && window.globalmapslct && window.globalmapslct.length > 0) {
            ctx.save();
            window.globalmapslct.forEach(tile => {
                const [y, x, rgbColor] = tile; // استقبال الإحداثيات واللون [y, x, rgb]

                // شرط الجوهر: إذا كانت هذه الخانة هي نفسها التي حددها اللاعب حالياً، نتخطى رسمها هنا
                if (selectedTile && selectedTile.x === x && selectedTile.y === y) {
                    return; // الانتقال للخانة التالية في الحلقة
                }

                // حساب المواقع على الكانفاس بنفس نظامك
                const tx = x * tileSize;
                const ty = -(y * tileSize);

                // تحويل لون RGB القادم من بايثون إلى RGBA لإضافة الشفافية (مثلاً 0.4)
                // إذا كان بايثون يرسل "rgb(0, 255, 0)" سنحوله إلى شفاف
                let finalColor = rgbColor;
                if (rgbColor.startsWith("rgb") && !rgbColor.startsWith("rgba")) {
                    finalColor = rgbColor.replace("rgb", "rgba").replace(")", ", 0.4)");
                }

                ctx.fillStyle = finalColor;
                ctx.fillRect(tx, ty, tileSize - 1, tileSize - 1);
                
                // رسم إطار خفيف جداً بنفس اللون ليعطي تحديداً تكتيكياً
                ctx.strokeStyle = finalColor.replace(", 0.4)", ", 0.65)");
                ctx.lineWidth = 2 / camera.zoom;
                ctx.strokeRect(tx, ty, tileSize - 1, tileSize - 1);
            });
            ctx.restore();
        }

        // 2. رسم الخانة المختارة من قبل اللاعب حالياً (selectedTile) فوق كل شيء
        if (selectedTile) {
            ctx.save();
            ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
            const tx = selectedTile.x * tileSize;
            const ty = -(selectedTile.y * tileSize);
            ctx.fillRect(tx, ty, tileSize - 1, tileSize - 1);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2 / camera.zoom;
            ctx.strokeRect(tx, ty, tileSize - 1, tileSize - 1);
            ctx.restore();
        }

        ctx.restore();
    }
    
    requestAnimationFrame(render);
}
// 1. الدالة الموحدة التي تخدم الحاسوب والهاتف معاً
function handleSelection(e) {
    const worldX = (e.clientX - (canvas.width/2 + camera.x)) / camera.zoom;
    const worldY = (e.clientY - (canvas.height/2 + camera.y)) / camera.zoom;
    
    const gx = Math.floor(worldX / tileSize);
    const gy = Math.floor((-worldY + tileSize) / tileSize); 
    
    // إلغاء القفل إذا لم تكن هناك قائمة مفتوحة
    if (if_cl === 0 && (objsl_x !== -1 || objsl_y !== -1 || objsl_l !== -1)) {
        objsl_x = -1;
        objsl_y = -1;
        objsl_l = -1;
        showSubMenu('1');
        console.log("🧹 تم إلغاء القفل تلقائياً والعودة للقائمة الرئيسية 1");
    }
    
    // تحديد الخانة إذا كانت داخل حدود الخريطة
    if (gx >= 0 && gx < MAP_DIM-1 && gy >= 0 && gy < MAP_DIM-1) {
        selectedTile = { x: gx, y: gy };
        document.getElementById('pos1').innerText = `${gy}`;
        document.getElementById('pos2').innerText = `${gx}`;

        const code = worldMap[gy] ? worldMap[gy][gx] : null;
        document.getElementById('terrain').innerText = TERRAIN_CONFIG[code] ? TERRAIN_CONFIG[code].name : "-";
    }
}

// --- التفاعل والتحكم ---







// =====================================================
// نظام موحد للكمبيوتر والهاتف
// Mouse + Touch + Pen
// =====================================================

let pointerDownX = 0;
let pointerDownY = 0;
let pointerMoved = false;

canvas.style.touchAction = "none";


// -----------------------------------------------------
// تحويل إحداثيات الشاشة إلى إحداثيات Canvas
// -----------------------------------------------------
function getPointerPosition(e) {

    const rect = canvas.getBoundingClientRect();

    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
    };
}


// -----------------------------------------------------
// بداية الضغط / اللمس
// -----------------------------------------------------
canvas.addEventListener("pointerdown", e => {

    e.preventDefault();

    canvas.setPointerCapture(e.pointerId);

    const pos = getPointerPosition(e);

    pointerDownX = pos.x;
    pointerDownY = pos.y;

    pointerMoved = false;

    isDragging = true;

    lastMouse = {
        x: pos.x,
        y: pos.y
    };
});


// -----------------------------------------------------
// تحريك الماوس / الإصبع
// -----------------------------------------------------
canvas.addEventListener("pointermove", e => {

    if (!isDragging) return;

    e.preventDefault();

    const pos = getPointerPosition(e);

    const dx = pos.x - lastMouse.x;
    const dy = pos.y - lastMouse.y;

    // إذا تحرك المؤشر/الإصبع أكثر من 8px
    // نعتبر العملية سحباً وليس نقرة
    if (
        Math.abs(pos.x - pointerDownX) > 8 ||
        Math.abs(pos.y - pointerDownY) > 8
    ) {
        pointerMoved = true;
    }

    camera.x += dx;
    camera.y += dy;

    lastMouse = {
        x: pos.x,
        y: pos.y
    };
});


// -----------------------------------------------------
// رفع الماوس / الإصبع
// -----------------------------------------------------
canvas.addEventListener("pointerup", e => {

    e.preventDefault();

    const pos = getPointerPosition(e);

    isDragging = false;

    // إذا لم يحدث سحب → هذه نقرة/لمسة
    if (!pointerMoved) {
        handleSelection({
            clientX: pos.x,
            clientY: pos.y,
            isCanvasCoordinates: true
        });
    }

    pointerMoved = false;
});


// -----------------------------------------------------
// إلغاء اللمس
// -----------------------------------------------------
canvas.addEventListener("pointercancel", e => {

    isDragging = false;
    pointerMoved = false;
});


// -----------------------------------------------------
// اختيار الخانة
// -----------------------------------------------------
function handleSelection(e) {

    let canvasX;
    let canvasY;

    // الإحداثيات وصلت بالفعل بالنسبة للـ Canvas
    if (e.isCanvasCoordinates) {

        canvasX = e.clientX;
        canvasY = e.clientY;

    } else {

        // تحويل إحداثيات الشاشة إلى إحداثيات Canvas
        const rect = canvas.getBoundingClientRect();

        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        canvasX =
            (e.clientX - rect.left) * scaleX;

        canvasY =
            (e.clientY - rect.top) * scaleY;
    }


    // -------------------------------------------------
    // تحويل Canvas coordinates إلى World coordinates
    // -------------------------------------------------

    const worldX =
        (canvasX - (canvas.width / 2 + camera.x))
        / camera.zoom;

    const worldY =
        (canvasY - (canvas.height / 2 + camera.y))
        / camera.zoom;


    // -------------------------------------------------
    // تحديد الخانة
    // -------------------------------------------------

    const gx = Math.floor(worldX / tileSize);

    const gy =
        Math.floor((-worldY + tileSize) / tileSize);


    // -------------------------------------------------
    // إلغاء القفل إذا لم تكن هناك قائمة مفتوحة
    // -------------------------------------------------

    if (
        if_cl === 0 &&
        (
            objsl_x !== -1 ||
            objsl_y !== -1 ||
            objsl_l !== -1
        )
    ) {

        objsl_x = -1;
        objsl_y = -1;
        objsl_l = -1;

        showSubMenu("1");

        console.log(
            "🧹 تم إلغاء القفل تلقائياً والعودة للقائمة الرئيسية 1"
        );
    }


    // -------------------------------------------------
    // التأكد أن الخانة داخل الخريطة
    // -------------------------------------------------

    if (
        gx >= 0 &&
        gx < MAP_DIM - 1 &&
        gy >= 0 &&
        gy < MAP_DIM - 1
    ) {

        // حفظ الخانة المختارة
        selectedTile = {
            x: gx,
            y: gy
        };


        // تحديث الإحداثيات
        document.getElementById("pos1").innerText =
            `${gy}`;

        document.getElementById("pos2").innerText =
            `${gx}`;


        // تحديث نوع التضاريس
        const code =
            worldMap[gy]
                ? worldMap[gy][gx]
                : null;

        document.getElementById("terrain").innerText =
            TERRAIN_CONFIG[code]
                ? TERRAIN_CONFIG[code].name
                : "-";


        console.log(
            `🎯 تم اختيار الخانة X=${gx}, Y=${gy}`
        );
    }
}

canvas.onwheel = e => {
    e.preventDefault();
    
    // تحديد معامل الزووم بناءً على اتجاه العجلة
    const factor = e.deltaY > 0 ? 0.9 : 1.1;
    
    // استخدام الدالة الموحدة لضمان الالتزام بالحدود (0.15 إلى 5)
    // وضمان ثبات المركز أثناء التكبير
    changeZoom(factor);
};

window.onresize = () => { 
    canvas.width = window.innerWidth; 
    canvas.height = window.innerHeight; 
};

// --- التشغيل الفعلي ---
window.onresize();
loadAssets();
setInterval(loadMapData, 300);
render();

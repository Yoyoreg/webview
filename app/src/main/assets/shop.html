<div id="merchant-page" class="page active" style="padding: 10px;">
    <h3 style="font-weight: 900; color: var(--text-main); margin-bottom: 20px;">🏪 متجري</h3>

    <div id="inventory-section">
        <h5 style="color: var(--text-muted); font-size: 0.9rem; border-bottom: 2px solid var(--accent); display: inline-block; margin-bottom: 15px;">إدارة المخزون</h5>
        
        <div id="inventory-list" style="display: flex; flex-direction: column; gap: 10px;">
            </div>

        <button class="btn-main" onclick="openAddModal()" style="margin-top: 20px; background: var(--accent);">
            + إضافة منتج جديد للمتجر
        </button>
    </div>
</div>

<div id="add-product-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; display: flex; align-items: center; justify-content: center;">
    <div style="background:var(--card); width:90%; max-width:380px; padding:20px; border-radius:20px; color: var(--text-main);">
        <h4 style="margin-bottom:20px;">إضافة منتج جديد</h4>
        
        <input type="file" id="p-image" accept="image/*" style="margin-bottom:15px;">
        <input type="text" id="p-name" placeholder="اسم المنتج" style="width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd;">
        <input type="number" id="p-price" placeholder="السعر (ɱ)" style="width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd;">
        <input type="number" id="p-qty" placeholder="الكمية الابتدائية" style="width:100%; padding:12px; margin-bottom:15px; border-radius:10px; border:1px solid #ddd;">
        
        <div style="display:flex; gap:10px;">
            <button class="btn-main" onclick="saveProduct()">نشر الآن</button>
            <button class="btn-main" onclick="closeAddModal()" style="background:#666;">إلغاء</button>
        </div>
    </div>
</div>

<script>
    // --- برمجة إدارة المخزون ---

    // 1. جلب المنتجات الخاصة بالبائع وعرضها
    function loadInventory() {
        const sellerId = localStorage.getItem('market_user_id');
        const list = document.getElementById('inventory-list');

        db.ref('products').orderByChild('seller').equalTo(sellerId).on('value', (snap) => {
            list.innerHTML = "";
            if (!snap.exists()) {
                list.innerHTML = "<p style='text-align:center; color:#888;'>مخزنك فارغ حالياً</p>";
                return;
            }

            snap.forEach(child => {
                const p = child.val();
                const id = child.key;
                list.innerHTML += `
                    <div style="background:var(--card); padding:12px; border-radius:12px; display:flex; align-items:center; gap:10px; border:1px solid rgba(0,0,0,0.05);">
                        <img src="${p.image}" style="width:45px; height:45px; border-radius:8px; object-fit:cover;">
                        <div style="flex:1">
                            <div style="font-weight:bold; font-size:0.9rem;">${p.name}</div>
                            <div style="font-size:0.8rem; color:var(--accent);">الكمية: <span id="q-${id}">${p.quantity}</span> | ${p.price} ɱ</div>
                        </div>
                        <div style="display:flex; gap:5px;">
                            <button onclick="changeQty('${id}', 1)" style="padding:5px 10px; border-radius:5px; border:none; background:#34c759; color:white;">+</button>
                            <button onclick="changeQty('${id}', -1)" style="padding:5px 10px; border-radius:5px; border:none; background:#ff9500; color:white;">-</button>
                            <button onclick="deleteP('${id}')" style="background:none; border:none; font-size:1.2rem;">🗑️</button>
                        </div>
                    </div>
                `;
            });
        });
    }

    // 2. تغيير الكمية المتبقية
    function changeQty(id, val) {
        const ref = db.ref(`products/${id}/quantity`);
        ref.transaction(current => (current || 0) + val);
    }

    // 3. حذف المنتج
    function deleteP(id) {
        if(confirm("هل تريد حذف هذا المنتج من المتجر؟")) {
            db.ref(`products/${id}`).remove();
        }
    }

    // 4. وظائف النافذة
    function openAddModal() { document.getElementById('add-product-modal').style.display = 'flex'; }
    function closeAddModal() { document.getElementById('add-product-modal').style.display = 'none'; }

    // تشغيل الجلب عند فتح الصفحة
    loadInventory();
</script>

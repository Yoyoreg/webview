<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyLOC Pro | حافظة المواقع الذكية</title>
    <style>
        :root {
            --bg: #111827;
            --card-bg: #1f2937;
            --accent: #10b981; 
            --accent-gradient: linear-gradient(135deg, #10b981, #059669);
            --header-bg: rgba(31, 41, 55, 0.7);
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --input-bg: #111827;
            --border-color: #374151;
            --star-color: #fbbf24;
            /* ألوان شريط التمرير */
            --sb-track: #1f2937;
            --sb-thumb: #4b5563;
            --sb-thumb-hover: #10b981;
        }

        [data-theme="light"] {
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --accent: #059669; 
            --accent-gradient: linear-gradient(135deg, #059669, #047857);
            --header-bg: rgba(255, 255, 255, 0.8);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --input-bg: #f9fafb;
            --border-color: #d1d5db;
            /* ألوان شريط التمرير للمظهر الفاتح */
            --sb-track: #e5e7eb;
            --sb-thumb: #9ca3af;
            --sb-thumb-hover: #059669;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 🖌️ شريط التمرير (Scrollbar) أغلظ ومتناسق مع النمط */
        ::-webkit-scrollbar {
            width: 10px; 
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--sb-track);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--sb-thumb);
            border-radius: 10px;
            border: 2px solid var(--sb-track); 
            transition: background 0.3s;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--sb-thumb-hover); 
        }

        html {
            scrollbar-width: auto;
            scrollbar-color: var(--sb-thumb) var(--sb-track);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0 15px;
            box-sizing: border-box;
        }

        /* تصميم الرأس الاحترافي */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 15px;
            margin: 15px 0;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* حاوية الأيقونة نقية وبدون إطار */
        .header-logo .icon-box {
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: none;
            border: none;
            padding: 0;
            margin: 0;
        }

        /* عرض صورة الـ SVG بشكل طبيعي بالكامل */
        .header-logo .icon-box .svg-icon {
            width: 28px;
            height: 28px;
            display: block;
            object-fit: contain;
        }

        h1 {
            font-size: 20px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .theme-toggle-btn {
            background-color: var(--bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s ease;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        .theme-toggle-btn:active {
            transform: scale(0.95);
        }

        .controls-box {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg);
            padding: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: background-color 0.3s;
        }

        .search-input {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: 2px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .filter-select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .locations-list {
            flex: 1;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 90px; 
        }

        .location-card {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 20px;
            border-right: 6px solid var(--accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 1px solid rgba(255,255,255,0.03);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .place-name {
            font-size: 18px;
            font-weight: bold;
        }

        .distance-badge {
            background-color: var(--accent);
            color: white;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 6px;
            display: inline-block;
        }

        .place-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin: 10px 0;
            line-height: 1.5;
        }

        .stars-view {
            color: var(--star-color);
            font-size: 20px;
            margin: 6px 0;
            display: inline-flex;
            gap: 2px;
            direction: ltr;
        }

        .star-interactive {
            cursor: pointer;
            transition: transform 0.1s;
        }

        .star-interactive:hover {
            transform: scale(1.2);
        }

        .tags-container {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .tag {
            background-color: rgba(16, 185, 129, 0.12);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
        }

        .card-actions {
            margin-top: 14px;
            display: flex;
            gap: 6px;
        }

        .btn-action {
            flex: 1;
            padding: 11px 6px;
            font-size: 12px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
        }

        .btn-action:active { transform: scale(0.97); }
        .btn-go { background-color: #2563eb; color: white; }
        .btn-copy { background-color: #8b5cf6; color: white; }
        .btn-delete { background-color: #dc2626; color: white; }

        .btn-float {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 440px;
            background: var(--accent-gradient);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
            text-align: center;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            width: 95%; max-width: 400px;
            padding: 25px; border-radius: 24px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        .modal-content h3 { margin-top: 0; color: var(--accent); font-weight: 800; }

        .form-group input, .form-group textarea {
            width: 100%; padding: 12px; margin: 6px 0;
            border-radius: 10px; border: 1px solid var(--border-color);
            background-color: var(--input-bg); 
            color: var(--text-main);
            font-size: 14px; box-sizing: border-box;
            outline: none;
        }

        .rating-input-container {
            margin: 12px 0;
            text-align: center;
        }
        .rating-input-container label {
            font-size: 14px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 5px;
        }
        .stars-rating {
            display: flex;
            justify-content: center;
            gap: 8px;
            direction: ltr;
        }
        .star-clickable {
            font-size: 32px;
            cursor: pointer;
            color: #4b5563;
            transition: transform 0.1s;
        }
        .star-clickable.active {
            color: var(--star-color);
        }

        .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .btn-modal { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-save { background: var(--accent-gradient); color: white; }
        .btn-cancel { background-color: #6b7280; color: white; }

        .hidden { display: none !important; }
        .no-data { text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 14px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <div class="header-logo">
            <div class="icon-box">
                <img src="h.svg" alt="" class="svg-icon">
            </div>
            <h1>MyLOC Pro</h1>
        </div>
        <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeBtn">🌙 مظهر ليلي</button>
    </div>
    
    <div class="controls-box">
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث بالاسم، الملاحظات، أو الكلمات..." oninput="processFilterAndSearch()">
        <select id="filterSelect" class="filter-select" onchange="processFilterAndSearch()">
            <option value="default">الترتيب الافتراضي (الأحدث)</option>
            <option value="distance">📍 الأقرب مسافة إليّ</option>
            <option value="rating">⭐ الأعلى تقييماً</option>
        </select>
    </div>

    <div class="locations-list" id="locationsList"></div>

    <button class="btn-float" onclick="openModal()">➕ حفظ موقع جديد</button>
</div>

<div class="modal hidden" id="locationModal">
    <div class="modal-content">
        <h3>📍 حفظ موقع جديد</h3>
        <div class="form-group">
            <input type="text" id="placeName" placeholder="اسم المكان...">
            <textarea id="placeDesc" rows="2" placeholder="وصف المكان أو ملاحظات تفصيلية..."></textarea>
            <input type="text" id="placeTags" placeholder="كلمات مفتاحية (افصل بينها بفاصلة ,)">
        </div>
        
        <div class="rating-input-container">
            <label>تقييمك للمكان:</label>
            <div class="stars-rating">
                <span class="star-clickable" onclick="setModalRatingValue(1)" data-val="1">★</span>
                <span class="star-clickable" onclick="setModalRatingValue(2)" data-val="2">★</span>
                <span class="star-clickable" onclick="setModalRatingValue(3)" data-val="3">★</span>
                <span class="star-clickable" onclick="setModalRatingValue(4)" data-val="4">★</span>
                <span class="star-clickable" onclick="setModalRatingValue(5)" data-val="5">★</span>
            </div>
        </div>

        <div id="gpsStatus" style="font-size: 12px; color: #2563eb; text-align: center; margin: 5px 0;"></div>
        <div class="modal-buttons">
            <button class="btn-modal btn-save" onclick="saveNewLocation()">💾 التقاط وحفظ</button>
            <button class="btn-modal btn-cancel" onclick="closeModal()">إلغاء</button>
        </div>
    </div>
</div>

<script>
    let savedLocations = JSON.parse(localStorage.getItem('myloc_data_v2')) || [];
    let userCurrentCoords = null;
    let selectedModalRating = 5; 

    window.onload = () => { 
        const activeTheme = localStorage.getItem('myloc_theme') || 'dark';
        document.body.setAttribute('data-theme', activeTheme);
        updateThemeButton(activeTheme);
        requestUserLocation();
    };

    function requestUserLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userCurrentCoords = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    processFilterAndSearch();
                },
                (error) => {
                    processFilterAndSearch(); 
                },
                { enableHighAccuracy: true, timeout: 7000 }
            );
        } else {
            processFilterAndSearch();
        }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c; 
    }

    function setModalRatingValue(val) {
        selectedModalRating = val;
        const stars = document.querySelectorAll('.stars-rating .star-clickable');
        stars.forEach(star => {
            const starVal = parseInt(star.getAttribute('data-val'));
            if (starVal <= val) {
                star.classList.add('active');
            } else {
                star.classList.remove('active');
            }
        });
    }

    function updateCardRating(locationId, newRating) {
        savedLocations = savedLocations.map(loc => {
            if (loc.id === locationId) {
                loc.rating = newRating;
            }
            return loc;
        });
        localStorage.setItem('myloc_data_v2', JSON.stringify(savedLocations));
        processFilterAndSearch();
    }

    function processFilterAndSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const filterType = document.getElementById('filterSelect').value;
        
        let processingList = savedLocations.map(loc => {
            if (userCurrentCoords) {
                loc.distance = calculateDistance(userCurrentCoords.lat, userCurrentCoords.lng, loc.lat, loc.lng);
            } else {
                loc.distance = null;
            }
            return loc;
        });

        if (query) {
            processingList = processingList.filter(loc => {
                const matchName = loc.name.toLowerCase().includes(query);
                const matchDesc = loc.desc.toLowerCase().includes(query);
                const matchTags = loc.tags.some(tag => tag.toLowerCase().includes(query));
                return matchName || matchDesc || matchTags;
            });
        }

        if (filterType === 'distance' && userCurrentCoords) {
            processingList.sort((a, b) => (a.distance || 99999) - (b.distance || 99999));
        } else if (filterType === 'rating') {
            processingList.sort((a, b) => b.rating - a.rating);
        } else {
            processingList.sort((a, b) => b.id - a.id);
        }

        renderLocations(processingList);
    }

    function renderLocations(list) {
        const container = document.getElementById('locationsList');
        container.innerHTML = "";

        if (list.length === 0) {
            container.innerHTML = `<div class="no-data">📭 لا توجد نتائج تطابق خيارات البحث الحالية.</div>`;
            return;
        }

        list.forEach((loc) => {
            const tagsHtml = loc.tags.map(t => `<span class="tag">#${t.trim()}</span>`).join('');
            
            let starsHtml = "";
            for(let i = 1; i <= 5; i++) {
                const starIcon = i <= loc.rating ? "★" : "☆";
                starsHtml += `<span class="star-interactive" onclick="updateCardRating(${loc.id}, ${i})">${starIcon}</span>`;
            }

            let distanceHtml = "";
            if (loc.distance !== null && loc.distance !== undefined) {
                distanceHtml = `<div class="distance-badge">📍 يبعد عنك: ${loc.distance.toFixed(2)} كم</div>`;
            } else {
                distanceHtml = `<div class="distance-badge" style="background:#4b5563;">📍 المسافة غير معروفة</div>`;
            }
            
            container.innerHTML += `
                <div class="location-card">
                    <div class="card-header">
                        <div>
                            <span class="place-name">${loc.name}</span>
                            <br>${distanceHtml}
                        </div>
                        <small style="color:var(--text-muted); font-size:11px;">${loc.date}</small>
                    </div>
                    <p class="place-desc">${loc.desc}</p>
                    <div class="stars-view">${starsHtml}</div>
                    <div class="tags-container">${tagsHtml}</div>
                    <div class="card-actions">
                        <button class="btn-action btn-go" onclick="openInGoogleMaps(${loc.lat}, ${loc.lng})">🚀 انطلق الآن</button>
                        <button class="btn-action btn-copy" onclick="copyLocationToClipboard('${loc.name}', ${loc.lat}, ${loc.lng})">📋 نسخ الموقع</button>
                        <button class="btn-action btn-delete" onclick="deleteLocation(${loc.id})">🗑️ حذف</button>
                    </div>
                </div>
            `;
        });
    }

    function openModal() {
        document.getElementById('locationModal').classList.remove('hidden');
        setModalRatingValue(5); 
        document.getElementById('gpsStatus').innerText = "⏳ جاري محاولة جلب الإحداثيات الحالية للموقع الجديد...";
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userCurrentCoords = { lat: position.coords.latitude, lng: position.coords.longitude };
                    document.getElementById('gpsStatus').innerText = "✅ تم التقاط إحداثيات الـ GPS بنجاح.";
                },
                (err) => { document.getElementById('gpsStatus').innerText = "⚠️ وضع تجريبي: تعذر التقاط الموقع الجغرافي تلقائياً."; },
                { enableHighAccuracy: true }
            );
        }
    }

    function closeModal() {
        document.getElementById('locationModal').classList.add('hidden');
        document.getElementById('placeName').value = "";
        document.getElementById('placeDesc').value = "";
        document.getElementById('placeTags').value = "";
    }

    function saveNewLocation() {
        const name = document.getElementById('placeName').value.trim();
        const desc = document.getElementById('placeDesc').value.trim();
        const tagsRaw = document.getElementById('placeTags').value.trim();

        if (!name) { alert("يرجى تسمية المكان!"); return; }

        let targetLat = userCurrentCoords ? userCurrentCoords.lat : 34.8783; 
        let targetLng = userCurrentCoords ? userCurrentCoords.lng : -1.3150;

        const tags = tagsRaw ? tagsRaw.split(',') : [];

        const newPlace = {
            id: Date.now(),
            name: name,
            desc: desc || "لا توجد تفاصيل إضافية.",
            tags: tags,
            lat: targetLat,
            lng: targetLng,
            rating: selectedModalRating,
            date: new Date().toLocaleDateString('ar-EG')
        };

        savedLocations.unshift(newPlace);
        localStorage.setItem('myloc_data_v2', JSON.stringify(savedLocations));
        
        processFilterAndSearch();
        closeModal();
        alert("✅ تم حفظ الموقع بنجاح!");
    }

    function openInGoogleMaps(lat, lng) {
        const url = `https://maps.google.com/?q=${lat},${lng}`;
        window.open(url, '_blank');
    }

    function copyLocationToClipboard(name, lat, lng) {
        const mapUrl = `https://maps.google.com/?q=${lat},${lng}`;
        const shareText = `📍 موقع مخزن عبر تطبيق MyLOC\nالمكان: *${name}*\nرابط الخريطة المباشر:\n${mapUrl}`;

        navigator.clipboard.writeText(shareText).then(() => {
            alert("📋 تم نسخ تفاصيل ورابط خرائط جوجل لهذا الموقع بنجاح!");
        }).catch((err) => {
            alert(`تفضل رابط خرائط جوجل للموقع:\n${mapUrl}`);
        });
    }

    function deleteLocation(id) {
        if (confirm("هل تريد حذف هذا الموقع من حافظة MyLOC؟")) {
            savedLocations = savedLocations.filter(loc => loc.id !== id);
            localStorage.setItem('myloc_data_v2', JSON.stringify(savedLocations));
            processFilterAndSearch();
        }
    }

    function toggleTheme() {
        const currentTheme = document.body.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.body.setAttribute('data-theme', newTheme);
        localStorage.setItem('myloc_theme', newTheme);
        updateThemeButton(newTheme);
    }

    function updateThemeButton(theme) {
        const btn = document.getElementById('themeBtn');
        btn.innerHTML = theme === 'light' ? '☀️' : '🌙';
    }
</script>
</body>
</html>

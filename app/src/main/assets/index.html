<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marcidia Market</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        :root {
            --accent: #007aff;
            --bg: #f8f9fa;
            --card: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #707070;
        }

        [data-theme="dark"] {
            --bg: #121212; --card: #1e1e1e; --text-main: #ffffff; --text-muted: #a0a0a0;
        }

        body {
            margin: 0; background-color: #e2e8f0; font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 450px; height: 100vh; background: var(--bg);
            display: flex; flex-direction: column; position: relative;
        }

        header {
            height: 65px; background: var(--card); display: flex;
            align-items: center; justify-content: space-between; padding: 0 20px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        main { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 90px; }

        .page { display: none; animation: fadeIn 0.2s ease; }
        .page.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* الأزرار والمدخلات */
        input[type="text"], input[type="password"] {
            width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px;
            border: 1px solid #ddd; background: var(--card); color: var(--text-main); box-sizing: border-box;
        }
        .btn-main {
            width: 100%; padding: 15px; background: var(--accent); color: white;
            border: none; border-radius: 12px; font-weight: 700; cursor: pointer;
        }

        /* شريط التنقل */
        footer {
            position: absolute; bottom: 15px; left: 5%; width: 90%; height: 65px;
            background: var(--card); border-radius: 20px; display: none;
            justify-content: space-around; align-items: center; box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; color: var(--text-muted); }
        .nav-item.active { color: var(--accent); }

        /* زر اللون البسيط */
        .color-picker-container {
            display: flex; align-items: center; gap: 10px; 
            background: var(--card); padding: 15px; border-radius: 15px; margin-top: 20px;
        }
        .color-box {
            width: 40px; height: 40px; border-radius: 8px; border: 2px solid #ddd;
            overflow: hidden; position: relative;
        }
        .color-box input {
            position: absolute; top: -5px; left: -5px; width: 60px; height: 60px; cursor: pointer;
        }
    </style>
</head>
<body data-theme="light">

<div class="app-container">
    <header>
        <div onclick="toggleDarkMode()" id="theme-icon" style="cursor:pointer">🌙</div>
        <div style="display:flex; align-items:center; gap:8px">
            <img src="i.svg" style="width:25px" onerror="this.src='https://cdn-icons-png.flaticon.com/512/665/665049.png'">
            <span style="font-weight:900; color:var(--text-main)">MMarket</span>
        </div>
        <div style="width:20px"></div>
    </header>

    <main id="content-area">
        <div id="login-page" class="page active">
            <div style="text-align: center; margin-top: 40px;">
                <h2 style="color:var(--text-main)">تسجيل الدخول</h2>
                <input type="text" id="loginName" placeholder="اسم المستخدم">
                <input type="password" id="loginPass" placeholder="كلمة المرور">
                <button class="btn-main" onclick="handleLogin()">دخول</button>
            </div>
        </div>

        <div id="user-store-page" class="page">
            <h3 style="color:var(--text-main)"> المتجر</h3>
            <div id="user-store-content">جاري التحميل...</div>
        </div>

        <div id="merchant-page" class="page">
            <h3 style="color:var(--text-main)">لوحة التحكم</h3>
            <div id="merchant-content">جاري التحميل...</div>
        </div>

        <div id="settings-page" class="page">
            <div style="background:var(--accent); color:white; padding:20px; border-radius:15px; text-align:center">
                <small>رصيدك الحالي</small>
                <div style="font-size:25px; font-weight:900"><span id="u-balance">0</span> ɱ</div>
            </div>
            
            <div class="color-picker-container">
                <div class="color-box">
                    <input type="color" onchange="updateSystemColor(this.value)">
                </div>
                <span style="color:var(--text-main); font-weight:700">لون النظام</span>
            </div>

            <button class="btn-main" onclick="logout()" style="background:#ff3b30; margin-top:20px">خروج</button>
        </div>
    </main>

    <footer id="main-nav">
        <div class="nav-item active" onclick="switchTab('user-store-page', this)"><b>تصفح</b></div>
        <div class="nav-item" onclick="switchTab('merchant-page', this)"><b>متجري</b></div>
        <div class="nav-item" onclick="switchTab('settings-page', this)"><b>حسابي</b></div>
    </footer>
</div>
<script src="merchant.js"></script>
<script src="user_store.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAlwI3fR5Gt7Wu8xIuBJzcUBQGv_WInzdY",
        databaseURL: "https://mycoin-f84d8-default-rtdb.firebaseio.com",
        projectId: "mycoin-f84d8"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // حل مشكلة استدعاء النوافذ (تحميل المحتوى داخلياً إذا فشل الملف الخارجي)
    async function loadPageContent(id, fileName, fallbackHtml) {
        try {
            const res = await fetch(fileName);
            if(res.ok) {
                document.getElementById(id).innerHTML = await res.text();
            } else {
                document.getElementById(id).innerHTML = fallbackHtml;
            }
        } catch(e) {
            document.getElementById(id).innerHTML = fallbackHtml;
        }
    }

    async function handleLogin() {
        const name = document.getElementById('loginName').value;
        const pass = btoa(document.getElementById('loginPass').value);
        const snap = await db.ref('users').orderByChild('name').equalTo(name).once('value');
        if (snap.exists()) {
            const id = Object.keys(snap.val())[0];
            if (snap.val()[id].pass === pass) {
                localStorage.setItem('market_user_id', id);
                enterApp();
            } else alert("كلمة المرور خطأ");
        } else alert("غير موجود");
    }


function enterApp() {
    // 1. إخفاء صفحات تسجيل الدخول
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('main-nav').style.display = 'flex';

    // 2. استدعاء واجهة "المشتري" (السوق العام)
    const storePage = document.getElementById('user-store-page'); // افترضنا أن هذا هو ID صفحة السوق
    storePage.innerHTML = UserStoreComponent.render(); // حقن الواجهة
    UserStoreComponent.init(); // تشغيل الجلب من الفايربيس

    storePage.classList.add('active');
}

// تعديل دالة التبديل لتناسب المكونات
// تعديل دالة التبديل لتناسب المكونات وتمنع اختفاء البيانات
// دالة التبديل الذكية للفحص واكتشاف الأخطاء وتصحيحها تلقائياً
// دالة التبديل الشاملة والمحصنة لدعم السوق، التاجر، ونافذة الحساب
async function switchTab(id, btn) {
    // 1. إخفاء جميع الصفحات وتفريغ الصفحات الديناميكية فقط (المتجر والتاجر) لتجنب تعليق الذاكرة
    document.querySelectorAll('.page').forEach(p => {
        p.classList.remove('active');
        
        // تفريغ فقط الصفحات الديناميكية التي تعتمد على المكونات، وتجنب تفريغ صفحة الإعدادات الثابتة
        if (p.id === 'user-store-page' || p.id === 'merchant-page') {
            p.innerHTML = ""; 
        }
    });

    // 2. التحقق من وجود حاوية الصفحة المستهدفة في الـ DOM وإظهارها
    const target = document.getElementById(id);
    if (!target) {
        console.error(`❌ خطأ: لم يتم العثور على عنصر يحمل الـ ID: ${id}`);
        return;
    }
    target.classList.add('active');

    // 3. تنظيف بقايا سكريبتات تشغيل الزبون المؤقتة
    const oldRuntime = document.getElementById('script-user-runtime');
    if (oldRuntime) oldRuntime.remove();

    // ----------------------------------------------------
    // 4. الحالات: بناء وحقن واجهات المتجر والتاجر ديناميكياً عند طلبها
    // ----------------------------------------------------
    
    // أ. حالة نافذة الزبائن (السوق العام) - يتم بناؤها وتحديثها حياً
    if (id === 'user-store-page') {
        if (typeof UserStoreComponent !== 'undefined') {
            if (!window.storeDb && typeof firebase !== 'undefined') {
                const storeConfig = {
                    apiKey: "AIzaSyC0Hf2Xy6YICYFgMGx6QUWsZWlroFX0OYc",
                    databaseURL: "https://mmarket-cb517-default-rtdb.firebaseio.com",
                    projectId: "mmarket-cb517"
                };
                const storeApp = firebase.apps.find(app => app.name === "storeInstance") 
                                 || firebase.initializeApp(storeConfig, "storeInstance");
                window.storeDb = storeApp.database();
            }
            target.innerHTML = UserStoreComponent.render();
            UserStoreComponent.init();
        }
    }
    
    // ب. حالة إدارة المتجر (التاجر) - يتم بناؤها وتحديثها حياً
    else if (id === 'merchant-page') {
        if (typeof MerchantComponent !== 'undefined') {
            target.innerHTML = MerchantComponent.render();
            MerchantComponent.init();
        }
    }
    
    // ج. حالة نافذة حسابي (settings-page) 
    // لا نقوم بحقن أي شيء هنا! المتصفح سيعرض عناصر الـ HTML الأصلية لصفحة الحساب (الرصيد، مغير الألوان، وزر الخروج) بأمان تام وثبات.
    else if (id === 'settings-page') {
        // جلب وتحديث رصيد المستخدم حياً من قاعدة البيانات 'db' الأساسية لعرضه في النافذة
        const userId = localStorage.getItem('market_user_id');
        if (userId) {
            db.ref(`users/${userId}/balance`).once('value').then(snapshot => {
                const balanceLabel = document.getElementById('u-balance');
                if (balanceLabel) {
                    balanceLabel.innerText = snapshot.exists() ? snapshot.val() : "0";
                }
            });
        }
    }

    // 5. تحديث الحالة البصرية لأزرار القائمة السفلية
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    if (btn) btn.classList.add('active');
}

    function updateSystemColor(c) {
        document.documentElement.style.setProperty('--accent', c);
        localStorage.setItem('market_color', c);
    }

    function toggleDarkMode() {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
        document.getElementById('theme-icon').innerText = isDark ? '🌙' : '☀️';
    }

    function logout() { localStorage.removeItem('market_user_id'); location.reload(); }

    window.onload = () => {
        const color = localStorage.getItem('market_color') || '#007aff';
        updateSystemColor(color);
        if (localStorage.getItem('market_user_id')) enterApp();
    };
</script>
</body>
</html>

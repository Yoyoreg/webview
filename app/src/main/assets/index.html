<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>HTTP Request Stress Test</title>
</head>
<body>

<h2>اختبار إرسال الطلبات</h2>

<p>الطلبات المرسلة: <span id="sent">0</span></p>
<p>الاستجابات: <span id="received">0</span></p>
<p>الأخطاء: <span id="errors">0</span></p>
<p>آخر استجابة: <span id="last">---</span></p>

<script>

const URL = 'http://192.168.8.103:8080/?msg=[156624,"map"]';

let sent = 0;
let received = 0;
let errors = 0;

// إرسال طلب جديد كل 300ms
setInterval(() => {

    sent++;
    document.getElementById("sent").textContent = sent;

    // لا ننتظر الطلب السابق إطلاقاً
    fetch(URL)
        .then(response => {

            received++;
            document.getElementById("received").textContent = received;

            document.getElementById("last").textContent =
                response.status + " OK";

            return response.text();
        })
        .then(data => {
            console.log(
                "✅ Response:",
                sent,
                data.substring(0, 100)
            );
        })
        .catch(error => {

            errors++;

            document.getElementById("errors").textContent = errors;

            document.getElementById("last").textContent =
                "ERROR";

            console.error(
                "❌ Request failed:",
                error
            );
        });

}, 300);

</script>

</body>
</html>

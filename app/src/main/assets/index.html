<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>عالم الإمبراطوريات</title>
    <style>
        /* ========================================================
           متغيرات التحكم بالأبعاد (عدّل الأبعاد من هنا بسهولة)
           ======================================================== */
        :root {
            --game-width: 1280px;
            --game-height: 900px; /* تم تعديل الارتفاع إلى 600 */
        }

        /* تصغير الهوامش بالكامل وملأ الشاشة */
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #000; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        /* حاوية اللعبة الافتراضية بأبعاد التحكم */
        .game-container {
            position: absolute;
            top: 50%; left: 50%;
            width: var(--game-width);  
            height: var(--game-height); 
            transform-origin: center center;
            transform: translate(-50%, -50%) scale(1);
            background: #2c2c2c;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        /* الـ Iframe الذي يستدعي ملف اللعبة الأصلي */
        .game-frame {
            width: 100%; height: 100%;
            border: none; margin: 0; padding: 0;
            display: block;
        }

        /* --- شاشة إجبار الوضع الأفقي (تحذير التدوير) --- */
        .orientation-warning {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #1a1a1a; color: #ffcc00;
            z-index: 1000000; /* فوق كل شيء */
            display: none; /* مخفية افتراضياً */
            flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; direction: rtl;
        }

        .orientation-warning svg {
            width: 80px; height: 80px; fill: #ffcc00;
            margin-bottom: 20px;
            animation: rotateDevice 2s infinite ease-in-out;
        }

        /* أنيميشن يوضح للاعب كيفية تدوير الهاتف */
        @keyframes rotateDevice {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        .orientation-warning h2 { margin: 0 0 10px 0; font-size: 1.5rem; }
        .orientation-warning p { margin: 0; color: #eee; font-size: 1rem; }

        /* --- التحكم الذكي بالأبعاد عبر الـ CSS --- */
        @media (orientation: landscape) {
            .orientation-warning { display: none; }
        }

        @media (orientation: portrait) {
            .orientation-warning { display: flex; }
        }
    </style>
</head>
<body>

    <div class="orientation-warning">
        <svg viewBox="0 0 24 24">
            <path d="M19 1H5c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm-2 18H7V5h10v14z"/>
        </svg>
        <h2>يرجى تدوير الهاتف</h2>
        <p>لتجربة اللعبة بامتياز، يرجى تفعيل دوران الشاشة التلقائي وضع الهاتف أفقياً.</p>
    </div>

    <div class="game-container" id="gameContainer">
        <iframe src="gpu/ht.html" class="game-frame"></iframe>
    </div>

    <script>
        /* ========================================================
           متغيرات الـ JavaScript للتحكم بأبعاد اللعبة الأساسية
           ======================================================== */
        const TARGET_WIDTH = 1280;
        const TARGET_HEIGHT = 900; // تم التعديل إلى 600 هنا أيضاً

        // دالة الموت والتمدد التلقائي الميكانيكي (Stretch Scaling)
        function resizeGame() {
            const container = document.getElementById('gameContainer');
            
            // أبعاد شاشة اللاعب الفعلية الحالية
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            // حساب نسبة التمدد بناءً على المتغيرات المحددة
            const scaleX = windowWidth / TARGET_WIDTH;
            const scaleY = windowHeight / TARGET_HEIGHT;
            
            // تطبيق المط والمطابقة التامة في منتصف الشاشة
            container.style.transform = `translate(-50%, -50%) scale(${scaleX}, ${scaleY})`;
        }

        // تشغيل الدالة عند تحميل الصفحة وعند تغيير حجم الشاشة (أو تدويرها)
        window.addEventListener('resize', resizeGame);
        window.addEventListener('load', resizeGame);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCoin - ɱ</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --danger: #ef4444; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; width: 100%; max-width: 450px; padding: 25px; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        h2, h3 { color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-top: 0; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 16px; }
        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        .hidden { display: none; }
        .balance-card { background: #eff6ff; padding: 15px; border-radius: 12px; border-right: 5px solid var(--primary); margin: 15px 0; }
        .amount { font-size: 28px; font-weight: 800; color: #1e40af; }
        .user-row { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .error { color: var(--danger); font-size: 13px; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="loginPage" class="card">
    <h2>تسجيل الدخول</h2>
    <input type="text" id="loginName" placeholder="الاسم الشخصي (مثلاً: douaa)">
    <input type="password" id="loginPass" placeholder="كلمة المرور">
    <div id="loginError" class="error"></div>
    <button onclick="handleLogin()">دخول آمن</button>
</div>

<div id="mainPage" class="card hidden">
    <h2 id="welcomeName">مرحباً</h2>
    
    <div id="userSection">
        <div class="balance-card">
            رصيدك الحالي: <br>
            <span id="myBalance" class="amount">0</span> <span style="font-size: 20px; color: #1e40af;">ɱ</span>
        </div>
    </div>

    <div id="adminSection" class="hidden">
        <h3>مراقبة الحسابات (لوحة البائع)</h3>
        <div id="usersList" style="margin-bottom: 20px; max-height: 200px; overflow-y: auto; border: 1px solid #eee; padding: 5px;"></div>
    </div>

    <hr>
    <h3>إرسال مبالغ</h3>
    <select id="receiverSelect"></select>
    <input type="number" id="sendAmount" placeholder="المبلغ بـ ɱ">
    <button onclick="processTransfer()" id="btnSend">تأكيد الإرسال</button>

    <hr>
    <button onclick="togglePassBox()" style="background: #64748b; font-size: 13px;">إعدادات كلمة المرور</button>
    <div id="passBox" class="hidden" style="background: #fff1f2; padding: 15px; border-radius: 12px; margin-top: 10px;">
        <input type="password" id="oldPass" placeholder="الكلمة القديمة">
        <input type="password" id="newPass" placeholder="الكلمة الجديدة">
        <button onclick="updatePassword()" style="background: var(--danger);">تحديث</button>
    </div>

    <button onclick="location.reload()" style="background:#000; margin-top: 20px; opacity: 0.7;">خروج</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAlwI3fR5Gt7Wu8xIuBJzcUBQGv_WInzdY",
        authDomain: "mycoin-f84d8.firebaseapp.com",
        databaseURL: "https://mycoin-f84d8-default-rtdb.firebaseio.com",
        projectId: "mycoin-f84d8",
        storageBucket: "mycoin-f84d8.firebasestorage.app",
        messagingSenderId: "653110857661",
        appId: "1:653110857661:web:1db67f0d3d0bcc7af98cd4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let loggedInId = ""; // سيخزن user0 أو user1 داخلياً
    let cachedUser = null;

    // --- تسجيل الدخول بالاسم الشخصي ---
    async function handleLogin() {
        const inputName = document.getElementById('loginName').value.trim();
        const pass = document.getElementById('loginPass').value;
        const err = document.getElementById('loginError');

        try {
            const snapshot = await db.ref('users').orderByChild('name').equalTo(inputName).get();
            
            if (snapshot.exists()) {
                const data = snapshot.val();
                const id = Object.keys(data)[0]; 
                const user = data[id];

                if (user.pass === pass) {
                    loggedInId = id;
                    cachedUser = user;
                    startApp();
                } else {
                    err.innerText = "كلمة المرور خاطئة!";
                }
            } else {
                err.innerText = "هذا الاسم غير مسجل!";
            }
        } catch (e) { err.innerText = "خطأ في الاتصال!"; }
    }

    function startApp() {
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('mainPage').classList.remove('hidden');

        db.ref('users').on('value', (snap) => {
            const users = snap.val();
            const select = document.getElementById('receiverSelect');
            const list = document.getElementById('usersList');
            
            select.innerHTML = "";
            list.innerHTML = "";

            for (let id in users) {
                if (id !== loggedInId) {
                    select.add(new Option(users[id].name, id));
                }
                if (loggedInId === 'user0') {
                    list.innerHTML += `<div class="user-row"><span>${users[id].name}</span> <b>${users[id].balance} ɱ</b></div>`;
                }
            }

            cachedUser = users[loggedInId];
            document.getElementById('welcomeName').innerText = "مرحباً: " + cachedUser.name;
            document.getElementById('myBalance').innerText = (loggedInId === 'user0') ? "∞" : cachedUser.balance;
            
            if (loggedInId === 'user0') document.getElementById('adminSection').classList.remove('hidden');
        });
    }

    async function processTransfer() {
        const toId = document.getElementById('receiverSelect').value;
        const amount = parseFloat(document.getElementById('sendAmount').value);

        if (!amount || amount <= 0) return alert("أدخل مبلغاً صحيحاً!");

        try {
            const rSnap = await db.ref('users/' + toId).get();
            if (loggedInId !== 'user0' && cachedUser.balance < amount) {
                return alert("رصيدك لا يكفي!");
            }

            const updates = {};
            if (loggedInId !== 'user0') updates['users/' + loggedInId + '/balance'] = cachedUser.balance - amount;
            updates['users/' + toId + '/balance'] = rSnap.val().balance + amount;

            await db.ref().update(updates);
            alert("تم إرسال " + amount + " ɱ بنجاح!");
            document.getElementById('sendAmount').value = "";
        } catch (e) { alert("فشلت العملية!"); }
    }

    function togglePassBox() { document.getElementById('passBox').classList.toggle('hidden'); }

    async function updatePassword() {
        const oldP = document.getElementById('oldPass').value;
        const newP = document.getElementById('newPass').value;
        if (oldP !== cachedUser.pass) return alert("القديمة خاطئة!");
        await db.ref('users/' + loggedInId).update({ pass: newP });
        alert("تم التحديث!");
        togglePassBox();
    }
</script>
</body>
</html>

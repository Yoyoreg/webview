
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTTP Diagnostic Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #log {
            background: #111;
            color: #eee;
            padding: 15px;
            height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: Consolas, monospace;
            font-size: 14px;
        }

        .stats {
            margin-bottom: 15px;
            line-height: 1.8;
        }

        button {
            padding: 10px 20px;
            margin-right: 5px;
            cursor: pointer;
        }

        .warning {
            font-weight: bold;
        }
    </style>
</head>

<body>

<h2>اختبار HTTP التشخيصي</h2>

<div class="stats">
    المرسلة: <b id="sent">0</b><br>
    الناجحة: <b id="success">0</b><br>
    الأخطاء: <b id="errors">0</b><br>
    Timeout: <b id="timeouts">0</b><br>
    آخر زمن استجابة: <b id="time">---</b><br>
    أطول طلب: <b id="maxTime">---</b>
</div>

<button onclick="startTest()">▶ بدء الاختبار</button>
<button onclick="stopTest()">⏹ إيقاف</button>
<button onclick="clearLog()">🧹 مسح السجل</button>

<br><br>

<div id="log"></div>

<script>

const URL =
    'http://192.168.8.103:8080/?msg=[156624,"map"]';


// الفاصل بين الطلبات بعد انتهاء الطلب السابق
const INTERVAL = 300;


// مهلة انتظار HTTP Response
// إذا لم يصل Response خلال هذه المدة يتم إلغاء الطلب
const FETCH_TIMEOUT = 10000;


// مهلة قراءة محتوى Response بعد وصول الـ Headers
// مهمة جداً لمعرفة هل المشكلة في body نفسه
const BODY_TIMEOUT = 10000;


let running = false;

let sent = 0;
let success = 0;
let errors = 0;
let timeouts = 0;

let maxTime = 0;

const logElement = document.getElementById("log");


function log(message) {

    const now = new Date();

    const time =
        now.toLocaleTimeString() + "." +
        String(now.getMilliseconds()).padStart(3, "0");

    logElement.textContent +=
        `[${time}] ${message}\n`;

    logElement.scrollTop =
        logElement.scrollHeight;

    console.log(message);
}


function sleep(ms) {

    return new Promise(resolve =>
        setTimeout(resolve, ms)
    );
}


/*
========================================================
تشغيل عملية مع Timeout
========================================================
*/

async function fetchWithTimeout(url, options, timeout) {

    const controller = new AbortController();

    const timeoutId = setTimeout(() => {

        controller.abort();

    }, timeout);


    try {

        const response = await fetch(url, {

            ...options,

            signal: controller.signal

        });

        return response;

    } finally {

        clearTimeout(timeoutId);

    }
}


/*
========================================================
قراءة Body مع Timeout مستقل
========================================================
*/

async function readBodyWithTimeout(response, timeout) {

    const controller = new AbortController();

    const timeoutId = setTimeout(() => {

        controller.abort();

    }, timeout);


    try {

        /*
        نستخدم reader بدلاً من response.text()
        حتى نعرف بالضبط هل البيانات تصل تدريجياً
        أم أن القراءة متوقفة.
        */

        const reader = response.body.getReader();

        const decoder = new TextDecoder();

        let text = "";

        let totalBytes = 0;

        while (true) {

            const result = await Promise.race([

                reader.read(),

                new Promise((_, reject) => {

                    setTimeout(() => {

                        reject(
                            new Error(
                                "BODY_READ_TIMEOUT"
                            )
                        );

                    }, timeout);

                })

            ]);


            if (result.done) {
                break;
            }


            if (result.value) {

                totalBytes += result.value.length;

                text += decoder.decode(
                    result.value,
                    { stream: true }
                );


                log(
                    `   📥 Body chunk: +${result.value.length} bytes | المجموع: ${totalBytes}`
                );
            }
        }


        text += decoder.decode();

        return {
            text,
            totalBytes
        };

    } finally {

        clearTimeout(timeoutId);

    }
}


/*
========================================================
إرسال طلب واحد
========================================================
*/

async function sendRequest() {

    sent++;

    document.getElementById("sent").textContent =
        sent;


    const requestNumber = sent;

    const startTime = performance.now();


    log("");
    log("========================================");

    log(
        `🔵 [${requestNumber}] بدء الطلب`
    );

    log(
        `🎯 URL: ${URL}`
    );

    log(
        `📡 المرحلة: FETCH — انتظار HTTP Response`
    );


    try {

        /*
        ====================================================
        المرحلة 1:
        إرسال الطلب وانتظار Headers / HTTP Response
        ====================================================
        */

        const response = await fetchWithTimeout(

            URL,

            {
                method: "GET",

                cache: "no-store",

                redirect: "follow"
            },

            FETCH_TIMEOUT

        );


        const responseTime =
            Math.round(
                performance.now() - startTime
            );


        document.getElementById("time").textContent =
            responseTime + " ms";


        if (responseTime > maxTime) {

            maxTime = responseTime;

            document.getElementById("maxTime").textContent =
                maxTime + " ms";
        }


        log(
            `🟢 [${requestNumber}] HTTP Response وصل`
        );

        log(
            `⏱ زمن الوصول إلى Response: ${responseTime} ms`
        );

        log(
            `📊 Status: ${response.status} ${response.statusText}`
        );

        log(
            `🌐 Final URL: ${response.url}`
        );

        log(
            `📋 Content-Type: ${response.headers.get("content-type") || "---"}`
        );

        log(
            `📦 Content-Length: ${response.headers.get("content-length") || "---"}`
        );


        /*
        ====================================================
        إذا وصلنا هنا فهذا مهم جداً:
        
        الهاتف نجح في إرسال الطلب،
        والسيرفر/Node أعاد HTTP Response.

        المشكلة ليست في انتظار الاتصال نفسه.
        ====================================================
        */


        if (!response.ok) {

            errors++;

            document.getElementById("errors").textContent =
                errors;


            log(
                `❌ [${requestNumber}] HTTP ERROR: ${response.status}`
            );

            return;
        }


        /*
        ====================================================
        المرحلة 2:
        قراءة Body
        ====================================================
        */

        log(
            `📖 [${requestNumber}] بدأ قراءة Response Body...`
        );


        const bodyStart =
            performance.now();


        let bodyResult;


        try {

            bodyResult =
                await readBodyWithTimeout(
                    response,
                    BODY_TIMEOUT
                );


        } catch (bodyError) {

            const bodyElapsed =
                Math.round(
                    performance.now() - bodyStart
                );


            errors++;

            document.getElementById("errors").textContent =
                errors;


            log("");
            log(
                `🔴 [${requestNumber}] BODY READ FAILED`
            );

            log(
                `⏱ توقف بعد: ${bodyElapsed} ms`
            );

            log(
                `❗ Error: ${bodyError.message}`
            );


            if (bodyError.message === "BODY_READ_TIMEOUT") {

                timeouts++;

                document.getElementById("timeouts").textContent =
                    timeouts;


                log(
                    `🚨 [${requestNumber}] BODY TIMEOUT`
                );

                log(
                    `🚨 Headers وصلت، لكن Body لم يكتمل خلال ${BODY_TIMEOUT} ms`
                );
            }


            return;
        }


        const totalTime =
            Math.round(
                performance.now() - startTime
            );


        const text =
            bodyResult.text;


        const responseSize =
            bodyResult.totalBytes;


        log(
            `📦 [${requestNumber}] Body اكتمل`
        );

        log(
            `📦 الحجم: ${responseSize} bytes`
        );

        log(
            `⏱ زمن قراءة Body: ${
                Math.round(performance.now() - bodyStart)
            } ms`
        );

        log(
            `⏱ الزمن الكامل: ${totalTime} ms`
        );


        /*
        ====================================================
        فحص البيانات
        ====================================================
        */

        if (!text) {

            errors++;

            document.getElementById("errors").textContent =
                errors;


            log(
                `⚠️ [${requestNumber}] Response Body فارغ`
            );

            return;
        }


        /*
        ====================================================
        تحليل JSON
        ====================================================
        */

        try {

            const json =
                JSON.parse(text);


            success++;

            document.getElementById("success").textContent =
                success;


            log(
                `✅ [${requestNumber}] نجاح كامل — JSON صالح`
            );


            log(
                `📄 بداية البيانات: ${text.substring(0, 150)}`
            );


        } catch (jsonError) {

            errors++;

            document.getElementById("errors").textContent =
                errors;


            log(
                `⚠️ [${requestNumber}] HTTP ناجح لكن JSON غير صالح`
            );

            log(
                `❗ JSON Error: ${jsonError.message}`
            );

            log(
                `📄 البيانات: ${text.substring(0, 300)}`
            );
        }


    } catch (error) {


        const elapsed =
            Math.round(
                performance.now() - startTime
            );


        errors++;

        document.getElementById("errors").textContent =
            errors;


        log("");

        log(
            `🔴 [${requestNumber}] FETCH FAILED`
        );

        log(
            `⏱ توقف بعد: ${elapsed} ms`
        );

        log(
            `❗ Error name: ${error.name}`
        );

        log(
            `❗ Error message: ${error.message}`
        );

        log(
            `❗ Error: ${String(error)}`
        );


        /*
        ====================================================
        تحديد هل كان Timeout
        ====================================================
        */

        if (
            error.name === "AbortError" ||
            error.message.includes("abort")
        ) {

            timeouts++;

            document.getElementById("timeouts").textContent =
                timeouts;


            log(
                `🚨 [${requestNumber}] FETCH TIMEOUT`
            );

            log(
                `🚨 لم يصل HTTP Response خلال ${FETCH_TIMEOUT} ms`
            );

        } else {

            log(
                `📡 [${requestNumber}] لم يحصل المتصفح على HTTP Response`
            );
        }
    }
}


/*
========================================================
بدء الاختبار
========================================================
*/

async function startTest() {

    if (running) {

        log(
            "⚠️ الاختبار يعمل بالفعل."
        );

        return;
    }


    running = true;


    log("");
    log("========================================");
    log("🚀 بدأ الاختبار");
    log("========================================");

    log(
        `🎯 الهدف: ${URL}`
    );

    log(
        `⏱ الفاصل بعد انتهاء كل طلب: ${INTERVAL} ms`
    );

    log(
        `⏰ Fetch Timeout: ${FETCH_TIMEOUT} ms`
    );

    log(
        `⏰ Body Timeout: ${BODY_TIMEOUT} ms`
    );

    log(
        "🔄 النمط:"
    );

    log(
        "REQUEST → WAIT RESPONSE → READ BODY → WAIT 300ms"
    );


    while (running) {

        await sendRequest();


        if (!running)
            break;


        await sleep(INTERVAL);
    }


    log("");
    log(
        "⏹ توقف الاختبار."
    );
}


/*
========================================================
إيقاف
========================================================
*/

function stopTest() {

    if (!running)
        return;


    running = false;


    log("");
    log(
        "🛑 طلب إيقاف الاختبار..."
    );
}


/*
========================================================
مسح السجل
========================================================
*/

function clearLog() {

    logElement.textContent = "";


    sent = 0;
    success = 0;
    errors = 0;
    timeouts = 0;
    maxTime = 0;


    document.getElementById("sent").textContent =
        "0";

    document.getElementById("success").textContent =
        "0";

    document.getElementById("errors").textContent =
        "0";

    document.getElementById("timeouts").textContent =
        "0";

    document.getElementById("time").textContent =
        "---";

    document.getElementById("maxTime").textContent =
        "---";
}

</script>

</body>
</html>
